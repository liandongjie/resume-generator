projects:
    - name: OMMS 私募量化运维监控平台
      date: 2026年06月 - 2026年08月
      links:
          - GitHub开源：https://github.com/liandongjie/omms_app
      stack: Vue3 + TypeScript + FastAPI + MySQL + Redis + RabbitMQ + WebSocket + Docker
      intro: 面向私募量化交易系统运维场景，构建 OS、进程及日志统一监控平台，实现运行状态查询、异常筛选、日志检索和实时刷新等功能。
      bullets:
          - 针对 Redis 缓存失效时并发请求集中回源、导致数据库连接池耗尽的问题，为同一缓存 Key 引入 single-flight 请求合并；25 用户缓存失效压测下 P95 延迟由 **115s 降至 14s**，数据库连接峰值由 **41 降至 23**，并消除 QueuePool 超时。
          - 优化监控日志按日期、级别筛选的慢查询，通过 EXPLAIN ANALYZE 定位函数比较影响索引利用的问题，改为基于数据库大小写不敏感排序规则直接比较，并补充覆盖日期、日志级别和排序主键的联合索引，降低查询扫描与排序开销。以按日期统计 error 日志为例，COUNT 查询扫描量由 **100,260 行降至 5,072 行**，耗时由 **32.5ms 降至约 1.3ms**。
          - 针对 RabbitMQ 消息确认失败后重投可能导致重复写入的问题，按数据类型设计幂等消费机制：状态数据采用原子插入/更新，日志数据通过业务事件唯一标识和数据库唯一约束去重；通过故障注入验证数据库提交后消息确认失败并重投时仍不会产生重复记录。
    - name: 环境社会风险分析 WebGIS 平台（ESR-Platform）｜全栈开发
      date: 2021年10月 - 2022年03月
      links:
          - 在线访问：https://14.103.34.41:8081/
          - GitHub开源：https://github.com/liandongjie/ESR-Platform-Next
      stack: Vue3 + TypeScript + Flask + PostgreSQL/PostGIS + Redis + Celery + Rasterio + Docker
      intro: 面向环境社会风险分析场景，构建“研究区选择—空间分析—风险计算—地图展示—成果下载”的 WebGIS 分析平台，支持 12 项环境、人口及社会指标综合评估。
      bullets:
          - 使用JWT和PostgreSQL/PostGIS实现多用户任务中心，持久化研究区、任务状态及成果信息，并按用户隔离任务查询、预览和下载权限。
          - 将风险栅格校验从Python逐像元遍历改为NumPy布尔索引和向量化统计，百万像元级结果的校验中位耗时由 **974 ms降至6.4 ms，下降99.3%**。
          - 将风险图由逐像元GeoJSON改为后端生成透明PNG、前端使用单个ImageLayer展示；现有确定性基准中，响应体由约 **4.97 MB降至15 KB**，地图对象由 **16,139个降至1个**。
          - 使用Celery拆分Web请求与GIS计算，Redis负责队列、限流和提交幂等，并通过任务状态控制和定时补偿处理异常；50用户并发提交测试中，**50/50任务完成、HTTP错误率0%**，排队与执行p95分别为 **2.64秒和139 ms**。
          - 使用Docker Compose、Caddy部署至火山引擎，并通过GitHub Actions执行测试、镜像构建和数据库迁移检查；针对服务器构建GIS镜像耗时过长的问题，改为本地构建、压缩上传和服务器离线加载。
